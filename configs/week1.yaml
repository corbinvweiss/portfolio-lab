# A run is fully described by this file plus a git SHA. That is the whole point:
# a backtest you cannot reproduce is an anecdote.
name: week1

data:
  source: store          # "store" (ingested prices) or "synthetic"
  as_of: null            # ISO date for a point-in-time replay, or null for latest
  universe: configs/universe_week1.csv

signals:
  ts_momentum:
    lookback: 252
    skip: 21
    weight: 0.5
  xs_momentum:
    lookback: 252
    skip: 21
    weight: 0.5

regime:
  enabled: true
  vol_window: 21
  vol_ref_window: 252
  trend_window: 200
  floor: 0.25

risk:
  cov_method: shrunk     # sample | ewma | shrunk
  cov_window: 252

budget:
  target_vol: 0.10
  max_gross: 1.0
  max_weight: 0.35
  long_only: true

backtest:
  warmup: 300
  rebalance: monthly     # daily | weekly | monthly | quarterly
  cost_bps: 5.0

allocators:
  - vol_target
  - risk_parity
  - mean_variance
